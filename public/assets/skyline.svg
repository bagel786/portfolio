<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" preserveAspectRatio="none">
  <!-- far layer: taller blocks, darkest -->
  <g fill="#0d0a19">
    <rect x="30" y="90" width="90" height="210"/>
    <rect x="150" y="140" width="130" height="160"/>
    <rect x="330" y="60" width="70" height="240"/>
    <rect x="430" y="170" width="160" height="130"/>
    <rect x="640" y="110" width="90" height="190"/>
    <rect x="760" y="40" width="60" height="260"/>
    <rect x="860" y="150" width="140" height="150"/>
    <rect x="1050" y="90" width="80" height="210"/>
    <rect x="1170" y="180" width="150" height="120"/>
    <rect x="1370" y="70" width="75" height="230"/>
    <rect x="1480" y="140" width="120" height="160"/>
  </g>
  <!-- near layer: shorter rooftops with details -->
  <g fill="#110d20">
    <rect x="0" y="220" width="200" height="80"/>
    <rect x="70" y="190" width="50" height="40"/>
    <rect x="260" y="240" width="240" height="60"/>
    <rect x="380" y="205" width="36" height="45"/>
    <rect x="560" y="230" width="180" height="70"/>
    <rect x="800" y="250" width="260" height="50"/>
    <rect x="900" y="215" width="55" height="45"/>
    <rect x="1120" y="235" width="200" height="65"/>
    <rect x="1400" y="245" width="200" height="55"/>
    <rect x="1460" y="210" width="45" height="45"/>
    <!-- water tower -->
    <rect x="620" y="196" width="44" height="34"/>
    <path d="M616 196 h52 l-6 -10 h-40 Z"/>
    <rect x="626" y="230" width="4" height="12"/>
    <rect x="654" y="230" width="4" height="12"/>
    <!-- antennas -->
    <path d="M310 240 v-34 M298 218 h24" stroke="#110d20" stroke-width="3" fill="none"/>
    <path d="M1180 235 v-28 M1170 216 h20" stroke="#110d20" stroke-width="3" fill="none"/>
  </g>
  <!-- sparse lit windows -->
  <g>
    <rect x="795" y="80" width="7" height="10" fill="#9d4edd" opacity="0.5"/>
    <rect x="352" y="110" width="7" height="10" fill="#00f5d4" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="1085" y="140" width="7" height="10" fill="#00f5d4" opacity="0.35"/>
    <rect x="1395" y="120" width="7" height="10" fill="#9d4edd" opacity="0.45">
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="670" y="150" width="7" height="10" fill="#f5f5f0" opacity="0.2"/>
  </g>
  <!-- blinking rooftop beacons -->
  <circle cx="790" cy="34" r="3" fill="#9d4edd">
    <animate attributeName="opacity" values="1;0.15;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="365" cy="54" r="2.5" fill="#00f5d4">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/>
  </circle>
</svg>
